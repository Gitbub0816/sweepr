#
# Deploys the native Rust Sweepr auth service (services/auth-broker) to the
# single Fly.io app `sweepr-auth-prod` → auth.getsweepr.com. Validation gates
# the deploy; the deploy job runs only on main / manual dispatch and uses the
# app-scoped FLY_API_TOKEN. Runtime secrets live in Fly, never here.
#
# Action pinning: third-party actions below use moving tags for readability.
# Before production launch, pin actions/checkout, dtolnay/rust-toolchain,
# Swatinem/rust-cache, and superfly/flyctl-actions to reviewed commit SHAs.

name: Deploy Sweepr Auth

on:
  push:
    branches: [main]
    paths:
      - "services/auth-broker/**"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

concurrency:
  group: sweepr-auth-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: services/auth-broker

jobs:
  validate:
    name: Validate Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/auth-broker

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [validate]
    # PRs never reach this job (push:main / workflow_dispatch only), so
    # forked-PR runs cannot access the production environment's FLY_API_TOKEN.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
