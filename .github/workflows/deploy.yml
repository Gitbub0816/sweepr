  deploy-business:
    name: Deploy Business App (business.getsweepr.com)
    needs: deploy-status
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/business build
        env:
          VITE_CENTRAL_AUTH_ENABLED: ${{ vars.CENTRAL_AUTH_ENABLED }}
          # Path A: all non-admin apps share the ONE standard Clerk instance
          # (clerk.getsweepr.com). There is no separate business Clerk app, so
          # the business build uses the standard publishable key like every
          # other app. In central-auth mode the app skips Clerk entirely and
          # authenticates via the broker/login page.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: https://api.getsweepr.com
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            out=$(cd apps/business && pnpm exec wrangler pages deploy dist --project-name=sweepr-business --commit-dirty=true 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            # Non-transient errors (missing project, auth) must not burn retries.
            case "$out" in
              *"8000007"*|*"Project not found"*|*"Authentication error"*)
                echo "::error::non-retryable deploy error"; exit 1 ;;
            esac
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-auth:
    name: Deploy Auth Page (auth.getsweepr.com)
    needs: deploy-status
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/auth build
        env:
          # Central sign-in ceremony authenticates against the STANDARD Clerk
          # instance (clerk.getsweepr.com) — same publishable key as the
          # customer app. The page renders a graceful "almost ready" landing
          # state when the key is missing.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # The broker is the Fly service at auth.getsweepr.com (not the old
          # Cloudflare Worker host).
          VITE_BROKER_URL: https://broker.getsweepr.com
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            out=$(pnpm exec wrangler pages deploy apps/auth/dist --project-name=sweepr-auth --commit-dirty=true 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            case "$out" in
              *"8000007"*|*"Project not found"*|*"Authentication error"*)
                echo "::error::non-retryable deploy error"; exit 1 ;;
            esac
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Push central-auth runtime config to the Pages Functions (BFF) of each app.
  # Dark by default: runs ONLY when the repo variable CENTRAL_AUTH_ENABLED is
  # 'true'. The BROKER_KEY_* values are GitHub secrets you set; each must match
  # the same key on the Fly auth service. BROKER_URL points the BFFs at the Fly
  # broker. Nothing here touches the live Clerk path.
  sync-central-auth:
    name: Sync central-auth config to Pages projects
    needs: [deploy-customer, deploy-cleaner, deploy-business]
    if: github.ref == 'refs/heads/main' && vars.CENTRAL_AUTH_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Set Pages Functions secrets (BROKER_KEY_*, BROKER_URL, CENTRAL_AUTH_ENABLED)
        run: |
          set -e
          put() { printf '%s' "$2" | pnpm exec wrangler pages secret put "$1" --project-name="$3"; }
          # sweepr-dash serves the SAME cleaner app on dashboard.getsweepr.com,
          # so it needs the identical BFF config (BROKER_KEY_CLEANER etc.).
          for row in "customer:sweepr-customer:$BROKER_KEY_CUSTOMER" \
                     "cleaner:sweepr-cleaner:$BROKER_KEY_CLEANER" \
                     "cleaner:sweepr-dash:$BROKER_KEY_CLEANER" \
                     "business:sweepr-business:$BROKER_KEY_BUSINESS"; do
            app="${row%%:*}"; rest="${row#*:}"; project="${rest%%:*}"; key="${rest#*:}"
            if [ -z "$key" ]; then echo "::warning::no BROKER_KEY for $app; skipping"; continue; fi
            keyname=$(printf 'BROKER_KEY_%s' "$app" | tr '[:lower:]' '[:upper:]')
            put "$keyname" "$key" "$project"
            put CENTRAL_AUTH_ENABLED "true" "$project"
            put BROKER_URL "https://sweepr.fly.dev" "$project"
            if [ -n "$ORIGIN_SHARED_SECRET" ]; then put ORIGIN_SHARED_SECRET "$ORIGIN_SHARED_SECRET" "$project"; fi
            # Shared HMAC secret the BFF uses to mint API tokens the API worker
            # verifies (must equal the API's API_BROKER_TOKEN_SECRET). Without
            # it, /auth/token fails closed and central-mode API calls 401.
            if [ -n "$API_BROKER_TOKEN_SECRET" ]; then put API_BROKER_TOKEN_SECRET "$API_BROKER_TOKEN_SECRET" "$project"; fi
          done
        env:
          BROKER_KEY_CUSTOMER: ${{ secrets.BROKER_KEY_CUSTOMER }}
          BROKER_KEY_CLEANER: ${{ secrets.BROKER_KEY_CLEANER }}
          BROKER_KEY_BUSINESS: ${{ secrets.BROKER_KEY_BUSINESS }}
          ORIGIN_SHARED_SECRET: ${{ secrets.ORIGIN_SHARED_SECRET }}
          API_BROKER_TOKEN_SECRET: ${{ secrets.API_BROKER_TOKEN_SECRET }}
