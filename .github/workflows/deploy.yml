name: Deploy Sweepr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run API test suite
        run: npx vitest run apps/api/tests
      - run: pnpm security
      - name: Verify schema is up to date
        run: |
          node packages/db/build-schema.mjs
          node packages/db/verify-schema.mjs
          git diff --exit-code packages/db/schema.sql || (echo "ERROR: schema.sql is stale. Run 'node packages/db/build-schema.mjs' and commit the result." && exit 1)

  migrate:
    name: Apply DB Migrations
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Soft-skip ONLY when the DATABASE_URL secret is absent (e.g. forks).
      # A genuine migration failure must fail this job and block deploy-api.
      - name: Run migrations
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not set — skipping migrations"
            exit 0
          fi
          pnpm --filter @sweepr/db migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed verified test cleaner
        continue-on-error: true
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not set — skipping seed"
            exit 0
          fi
          pnpm --filter @sweepr/db seed:test-cleaner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_CLERK_ID: ${{ secrets.SEED_CLERK_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SEED_EMAIL: ${{ secrets.SEED_EMAIL }}
      # Isolated `demo` schema for service.getsweepr.com's demo apps — the
      # REAL apps/customer + apps/cleaner + apps/api, running against this
      # schema instead of `public` so nothing here can touch production data.
      # Soft-skips (never fails the deploy) if DATABASE_URL or the demo
      # account credentials aren't configured yet.
      - name: Build demo schema + seed demo personas
        continue-on-error: true
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not set — skipping demo schema"
            exit 0
          fi
          pnpm --filter @sweepr/db clone-demo-schema
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$DEMO_ACCOUNT_PASSWORD" ]; then
            echo "::warning::CLERK_SECRET_KEY / DEMO_ACCOUNT_PASSWORD not set — skipping demo persona seed"
            exit 0
          fi
          pnpm --filter @sweepr/db seed:demo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DEMO_ACCOUNT_PASSWORD: ${{ secrets.DEMO_ACCOUNT_PASSWORD }}

  deploy-api:
    name: Deploy API Worker (api.getsweepr.com)
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler deploy && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Sync worker secrets from GitHub repo secrets after each deploy. Only
      # non-empty values are pushed (printf avoids the trailing newline that has
      # broken integrations before). Existing secrets are left untouched when the
      # corresponding repo secret is unset.
      - name: Sync worker secrets
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | pnpm exec wrangler secret put "$1" >/dev/null \
                && echo "synced $1" || echo "::warning::failed to sync $1"
            fi
          }
          put SEAM_API_KEY "$SEAM_API_KEY"
          put SEAM_WEBHOOK_SECRET "$SEAM_WEBHOOK_SECRET"
          put SWEEPR_PLUS_MONTHLY_PRICE_ID "$SWEEPR_PLUS_MONTHLY_PRICE_ID"
          put SWEEPR_PLUS_ANNUAL_PRICE_ID "$SWEEPR_PLUS_ANNUAL_PRICE_ID"
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEAM_API_KEY: ${{ secrets.SEAM_API_KEY }}
          SEAM_WEBHOOK_SECRET: ${{ secrets.SEAM_WEBHOOK_SECRET }}
          SWEEPR_PLUS_MONTHLY_PRICE_ID: ${{ secrets.SWEEPR_PLUS_MONTHLY_PRICE_ID }}
          SWEEPR_PLUS_ANNUAL_PRICE_ID: ${{ secrets.SWEEPR_PLUS_ANNUAL_PRICE_ID }}

  deploy-analytics:
    name: Deploy Analytics Worker (metrics.getsweepr.com + /go links)
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # First-party site analytics: /collect ingest beacon on
      # metrics.getsweepr.com + the tracking-link redirector on
      # getsweepr.com/go/* (zone route). Kept separate from sweepr-api so
      # beacon traffic never shares the API's rate limits or failure domain.
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler deploy && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        working-directory: apps/analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # DATABASE_URL is required; ANALYTICS_IP_SALT and IPINFO_TOKEN are
      # optional (the worker derives a salt fallback and skips IPinfo
      # enrichment when unset).
      - name: Sync worker secrets
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | pnpm exec wrangler secret put "$1" >/dev/null \
                && echo "synced $1" || echo "::warning::failed to sync $1"
            fi
          }
          put DATABASE_URL "$DATABASE_URL"
          put ANALYTICS_IP_SALT "$ANALYTICS_IP_SALT"
          put IPINFO_TOKEN "$IPINFO_TOKEN"
        working-directory: apps/analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANALYTICS_IP_SALT: ${{ secrets.ANALYTICS_IP_SALT }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}


  deploy-mcp:
    name: Deploy MCP Worker (mcp.getsweepr.com)
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # MCP pricing sandbox: OAuth-protected MCP server that lets an external
      # LLM explore pricing config read-only, edit ONLY the quarantined
      # mcp_simulator_configs sandbox, and emit payloads a human admin
      # uploads in the admin console. No write path to live site data;
      # MCP_ENABLED (wrangler.toml var) is the kill switch.
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler deploy && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # All three secrets are required for the worker to serve traffic (it
      # fails closed with 503 until they exist). MCP_TOKEN_SECRET is any long
      # random string (openssl rand -hex 32); rotating it revokes every
      # outstanding MCP connection/token at once.
      - name: Sync worker secrets
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | pnpm exec wrangler secret put "$1" >/dev/null \
                && echo "synced $1" || echo "::warning::failed to sync $1"
            fi
          }
          put DATABASE_URL "$DATABASE_URL"
          put CLERK_ADMIN_SECRET_KEY "$CLERK_ADMIN_SECRET_KEY"
          put MCP_TOKEN_SECRET "$MCP_TOKEN_SECRET"
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_ADMIN_SECRET_KEY: ${{ secrets.CLERK_ADMIN_SECRET_KEY }}
          MCP_TOKEN_SECRET: ${{ secrets.MCP_TOKEN_SECRET }}

  deploy-api-demo:
    name: Deploy Demo API Worker (api-demo.getsweepr.com)
    needs: migrate
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Runs the EXACT SAME apps/api code as the production worker — the only
      # difference is which DATABASE_URL it's given. See wrangler.demo.toml.
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler deploy --config wrangler.demo.toml && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Same GitHub secrets as the production worker EXCEPT:
      #   DATABASE_URL     — same Neon connection string, with search_path
      #                      forced to the isolated `demo` schema. This one
      #                      line IS the entire prod/demo data wall.
      #   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET — dedicated Stripe
      #                      TEST-mode secrets (STRIPE_TEST_*), never the
      #                      live keys, so demo checkouts can never touch a
      #                      real card and live keys never need rotating.
      - name: Sync worker secrets
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | pnpm exec wrangler secret put "$1" --config wrangler.demo.toml >/dev/null \
                && echo "synced $1" || echo "::warning::failed to sync $1"
            fi
          }
          if [ -n "$DATABASE_URL" ]; then
            case "$DATABASE_URL" in
              *"?"*) DEMO_DB_URL="${DATABASE_URL}&options=-c%20search_path%3Ddemo,public" ;;
              *) DEMO_DB_URL="${DATABASE_URL}?options=-c%20search_path%3Ddemo,public" ;;
            esac
            put DATABASE_URL "$DEMO_DB_URL"
          else
            echo "::warning::DATABASE_URL not set — demo worker will fail every DB call until it is"
          fi
          put CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
          put STRIPE_SECRET_KEY "$STRIPE_TEST_SECRET_KEY"
          put STRIPE_WEBHOOK_SECRET "$STRIPE_TEST_WEBHOOK_SECRET"
          put MAILERSEND_API_KEY "$MAILERSEND_API_KEY"
          put R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
          put R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          put R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          put R2_BUCKET "$R2_BUCKET"
          put R2_PUBLIC_URL "$R2_PUBLIC_URL"
          put ACCESS_CODE_ENCRYPTION_KEY "$ACCESS_CODE_ENCRYPTION_KEY"
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          MAILERSEND_API_KEY: ${{ secrets.MAILERSEND_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          ACCESS_CODE_ENCRYPTION_KEY: ${{ secrets.ACCESS_CODE_ENCRYPTION_KEY }}

  deploy-marketing:
    name: Deploy Marketing (getsweepr.com)
    needs: deploy-api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/marketing build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_API_URL: https://api.getsweepr.com
          VITE_CUSTOMER_URL: https://app.getsweepr.com
          VITE_CLEANER_URL: https://clean.getsweepr.com
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/marketing/dist --project-name=sweepr-marketing --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-customer:
    name: Deploy Customer App (app.getsweepr.com)
    needs: deploy-marketing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/customer build
        env:
          VITE_CENTRAL_AUTH_ENABLED: ${{ vars.CENTRAL_AUTH_ENABLED }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_API_URL: https://api.getsweepr.com
          VITE_PRELAUNCH_FORCE: ${{ secrets.VITE_PRELAUNCH_FORCE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            ( cd apps/customer && pnpm exec wrangler pages deploy dist --project-name=sweepr-customer --commit-dirty=true ) && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cleaner:
    name: Deploy Cleaner App (clean.getsweepr.com)
    needs: deploy-customer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/cleaner build
        env:
          VITE_CENTRAL_AUTH_ENABLED: ${{ vars.CENTRAL_AUTH_ENABLED }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_API_URL: https://api.getsweepr.com
          VITE_PRELAUNCH_FORCE: ${{ secrets.VITE_PRELAUNCH_FORCE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            ( cd apps/cleaner && pnpm exec wrangler pages deploy dist --project-name=sweepr-cleaner --commit-dirty=true ) && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-customer-demo:
    name: Deploy Demo Customer App (demo.app.getsweepr.com)
    needs: [deploy-cleaner, deploy-api-demo]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The REAL apps/customer bundle — same code, same Clerk sign-in, same
      # everything — just pointed at the demo API worker (and so the isolated
      # demo DB schema) with a Stripe TEST publishable key. No demo-mode
      # branch exists in the app; a real Clerk session (the seeded demo
      # customer account) is what makes this safe to leave ungated.
      - run: pnpm --filter @sweepr/customer build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_TEST_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_API_URL: https://api-demo.getsweepr.com
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            ( cd apps/customer && pnpm exec wrangler pages deploy dist --project-name=sweepr-customer-demo --commit-dirty=true ) && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cleaner-demo:
    name: Deploy Demo Cleaner App (demo.clean.getsweepr.com)
    needs: [deploy-cleaner, deploy-api-demo]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The REAL apps/cleaner bundle, pointed at the demo API worker — see
      # deploy-customer-demo above for why this needs no app-code changes.
      - run: pnpm --filter @sweepr/cleaner build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_API_URL: https://api-demo.getsweepr.com
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            ( cd apps/cleaner && pnpm exec wrangler pages deploy dist --project-name=sweepr-cleaner-demo --commit-dirty=true ) && exit 0
