name: Deploy Sweepr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm security
      - name: Verify schema is up to date
        run: |
          node packages/db/build-schema.mjs
          node packages/db/verify-schema.mjs
          git diff --exit-code packages/db/schema.sql || (echo "ERROR: schema.sql is stale. Run 'node packages/db/build-schema.mjs' and commit the result." && exit 1)

  migrate:
    name: Apply DB Migrations
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Fail-soft: a missing DATABASE_URL secret (or a transient DB hiccup)
      # warns but never blocks the deploy.
      - name: Run migrations
        continue-on-error: true
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not set — skipping migrations"
            exit 0
          fi
          pnpm --filter @sweepr/db migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed verified test cleaner
        continue-on-error: true
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not set — skipping seed"
            exit 0
          fi
          pnpm --filter @sweepr/db seed:test-cleaner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_CLERK_ID: ${{ secrets.SEED_CLERK_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SEED_EMAIL: ${{ secrets.SEED_EMAIL }}

  deploy-api:
    name: Deploy API Worker (api.getsweepr.com)
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler deploy && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-marketing:
    name: Deploy Marketing (getsweepr.com)
    needs: deploy-api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/marketing build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_API_URL: https://api.getsweepr.com
          VITE_CUSTOMER_URL: https://app.getsweepr.com
          VITE_CLEANER_URL: https://clean.getsweepr.com
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/marketing/dist --project-name=sweepr-marketing --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-customer:
    name: Deploy Customer App (app.getsweepr.com)
    needs: deploy-marketing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/customer build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_API_URL: https://api.getsweepr.com
          VITE_PRELAUNCH_FORCE: ${{ secrets.VITE_PRELAUNCH_FORCE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/customer/dist --project-name=sweepr-customer --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cleaner:
    name: Deploy Cleaner App (clean.getsweepr.com)
    needs: deploy-customer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/cleaner build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_API_URL: https://api.getsweepr.com
          VITE_PRELAUNCH_FORCE: ${{ secrets.VITE_PRELAUNCH_FORCE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/cleaner/dist --project-name=sweepr-cleaner --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-dash:
    name: Deploy Cleaner Dashboard (dashboard.getsweepr.com)
    needs: deploy-cleaner
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/cleaner build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_API_URL: https://api.getsweepr.com
          VITE_PRELAUNCH_FORCE: ${{ secrets.VITE_PRELAUNCH_FORCE }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/cleaner/dist --project-name=sweepr-dash --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    name: Deploy Admin App (admin.getsweepr.com)
    needs: deploy-dash
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/admin build
        env:
          # Admin console uses its OWN Clerk application (admin.getsweepr.com).
          # Publishable keys are public; the literal fallback keeps the build
          # correct without requiring the optional override secret.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_ADMIN_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsuYWRtaW4uZ2V0c3dlZXByLmNvbSQ' }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_DASHBOARD_URL: ${{ secrets.VITE_POSTHOG_DASHBOARD_URL }}
          VITE_API_URL: https://api.getsweepr.com
          VITE_CF_ANALYTICS_TOKEN: ${{ secrets.VITE_CF_ANALYTICS_TOKEN }}
          VITE_CF_ZONE_ID: ${{ secrets.VITE_CF_ZONE_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_AUTH_TOKEN: ${{ secrets.VITE_SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
          VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/admin/dist --project-name=sweepr-admin --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-legal:
    name: Deploy Legal Site (legal.getsweepr.com)
    needs: deploy-admin
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/legal build
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/legal/dist --project-name=sweepr-legal --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-service:
    name: Deploy Service Demo (service.getsweepr.com)
    needs: deploy-legal
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/service build
        env:
          VITE_API_URL: https://api.getsweepr.com
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/service/dist --project-name=sweepr-service --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-status:
    name: Deploy Status Page (status.getsweepr.com)
    needs: deploy-service
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sweepr/status build
        env:
          VITE_API_URL: https://api.getsweepr.com
      - name: Deploy (with retry/backoff for Cloudflare rate limits)
        run: |
          # Jitter start so the parallel deploy jobs do not all hit the
          # Cloudflare API at t=0 (code 1042 rate limit).
          sleep $(( (RANDOM % 25) + 1 ))
          for attempt in 1 2 3 4 5 6; do
            pnpm exec wrangler pages deploy apps/status/dist --project-name=sweepr-status --commit-dirty=true && exit 0
            echo "::warning::deploy attempt $attempt failed (likely CF 1042 rate limit); backing off"
            sleep $(( attempt * 30 ))
          done
          echo "::error::deploy failed after 6 attempts"; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
