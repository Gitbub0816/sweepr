<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var t = localStorage.getItem('theme') || 'light';
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14b8a6" />
    <link rel="icon" type="image/svg+xml" href="/brand/sweepr-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/sweepr-mark-32.png" />
    <link rel="apple-touch-icon" href="/brand/sweepr-mark-180.png" />
    <title>Sweepr Admin</title>
    <meta name="robots" content="noindex, nofollow" />

</head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
