#
# SKIP module marker. Its presence tells `skipstone` to transpile this Swift
# target into a Kotlin/Gradle module. `mode: transpiled` = pure source-to-source
# (no native bridge) which is what SweeprKit needs — it is UI + models only.
skip:
  mode: 'transpiled'
build:
  contents:
    # Android Gradle dependencies that mirror the Swift package deps above.
    - block: 'dependencies'
      contents:
        - 'implementation("androidx.compose.material3:material3:1.2.1")'
