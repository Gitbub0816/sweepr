name = "sweepr-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 5th "site": the API + webhooks live on their own subdomain (api.getsweepr.com),
# NOT under a path on another site. This binds the Worker to the custom domain
# on deploy, exposing:
#   https://api.getsweepr.com/webhooks/stripe
#   https://api.getsweepr.com/webhooks/didit
#   https://api.getsweepr.com/webhooks/yardstik
# Requires the getsweepr.com zone to be in this Cloudflare account.
# NOTE: `routes` must sit ABOVE the first [section] header — TOML scopes keys
# to the preceding table, so a routes array under [vars] silently becomes an
# env var named "routes" and wrangler attaches nothing (api.getsweepr.com kept
# working only because the domain was already bound in the dashboard).
routes = [
  { pattern = "api.getsweepr.com", custom_domain = true }
]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "ec932b508b6b43dd85d9cdeabaa850c3"
preview_id = "ec932b508b6b43dd85d9cdeabaa850c3"

# PRIVATE evidence bucket for formal user reports (Trust & Safety). Unlike the
# public `sweepr` bucket (objects.getsweepr.com, presigned uploads), report
# photos must never be publicly readable: uploads and reads stream through the
# API — authenticated upload by the report owner, retrieval behind requireAdmin.
[[r2_buckets]]
binding = "REPORT_OBJECTS"
bucket_name = "sweepr-report-objects"

# Secrets stored in Cloudflare (set via wrangler secret put or dashboard):
# CLERK_SECRET_KEY
# DATABASE_URL
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# MAILERSEND_API_KEY
# POSTHOG_KEY                 (PERSONAL API key phx_... — a project key phc_... can't read event counts)
# SENTRY_DSN                  (Sentry -> Settings -> Projects -> <project> -> Client Keys (DSN);
#                              enables server-side forwarding of ALL platform errors to Sentry)
# SENTRY_AUTH_TOKEN           (Organization Auth Token — powers the admin Integrations tile)
# SENTRY_ORG / SENTRY_PROJECT (optional slugs; default sweepr-45 / javascript-nextjs)
# ACCESS_CODE_ENCRYPTION_KEY  (32-byte hex key: openssl rand -hex 32)
# SEAM_API_KEY                (Seam Bearer API key for connect.getseam.com — smart-lock Access Grants,
#                              Connect Webviews, device sync; server-side only, never sent to a client.
#                              Confirm the workspace has the customers' lock providers + Airbnb enabled)
# SEAM_WEBHOOK_SECRET         (Seam → Webhooks signing secret, whsec_… — Seam signs via Svix like Clerk.
#                              Register https://api.getsweepr.com/webhooks/seam and subscribe to
#                              connected_account.connected/.disconnected/.error, device.connected/.disconnected,
#                              access_grant.*/access_method.*. Unset = /webhooks/seam fails closed (500))
# DIDIT_API_KEY               (x-api-key for hosted session creation)
# DIDIT_WEBHOOK_SECRET        (HMAC-SHA256 webhook signature secret)
# R2_ACCOUNT_ID             (Cloudflare account ID)
# R2_ACCESS_KEY_ID          (R2 token access key ID)
# R2_SECRET_ACCESS_KEY      (R2 token secret access key)
# R2_BUCKET                 (value: sweepr)
# R2_PUBLIC_URL             (value: https://objects.getsweepr.com)
# R2_LEGAL_ACCESS_KEY_ID    (R2 API token for sweepr-legal bucket — PUT only)
# R2_LEGAL_SECRET_ACCESS_KEY
# LEGAL_ATTORNEY_SESSION_SECRET  (optional HMAC key for the external attorney
#                              review-portal session tokens; generate with
#                              openssl rand -hex 32. Falls back to a
#                              DATABASE_URL-derived key when unset.)
# YARDSTIK_API_KEY          (omit for mock mode)
# YARDSTIK_ACCOUNT_PACKAGE_ID
# YARDSTIK_SOR_MONITOR_PACKAGE_ID  (account_package_id of the ongoing SOR monitoring
#                            package; approved cleaners are auto-enrolled in continuous
#                            Sex Offender Registry monitoring when set — leave unset to
#                            disable enrollment)
# YARDSTIK_API_URL          (optional — defaults to https://api.yardstik.com; set to
#                            https://api.yardstik-staging.com for a staging account)
# YARDSTIK_WEBHOOK_SIGNATURE (value of a Yardstik dashboard API key literally named
#                            "WEBHOOK_SIGNATURE" — a separate key from YARDSTIK_API_KEY,
#                            shown only once when created. Yardstik has no multi-event
#                            webhook subscription UI: register EVERY event type you want
#                            (report.created, report.updated, ...) against the SAME url
#                            https://api.getsweepr.com/webhooks/yardstik — one signing key
#                            covers all of them since the handler dispatches on the body.)
# ALLOWED_ORIGINS
# CF_STREAM_ACCOUNT_ID      (Cloudflare account ID — same value as R2_ACCOUNT_ID)
# CF_STREAM_API_TOKEN       (API token with Cloudflare Stream:Edit permission)
# CLERK_WEBHOOK_SECRET      (from Clerk Dashboard → Webhooks → signing secret, starts with whsec_)
# CLERK_ADMIN_SECRET_KEY    (sk_live_… of the SEPARATE admin Clerk app — primary domain admin.getsweepr.com)
# CLERK_ADMIN_WEBHOOK_SECRET (whsec_… of the admin Clerk app's webhook pointing at
#                            https://api.getsweepr.com/webhooks/clerk-admin)
# CLERK_BUSINESS_SECRET_KEY  (sk_live_… of the SEPARATE business Clerk app — business.getsweepr.com;
#                            unset = business auth boundary is dark)
# CLERK_BUSINESS_WEBHOOK_SECRET (whsec_… of the business Clerk app's webhook)
# CLERK_CLEANER_SECRET_KEY   (sk_live_… of the dedicated cleaner Clerk app, once cleaners are split
#                            out of the shared primary instance; unset = cleaners use CLERK_SECRET_KEY)
# CLERK_CLEANER_WEBHOOK_SECRET (whsec_… of the dedicated cleaner Clerk app's webhook)
# API_BROKER_TOKEN_SECRET   (central-auth mode: shared HMAC secret the app BFFs use to mint short-lived
#                            API tokens after introspecting the broker session; MUST equal the value the
#                            deploy.yml sync-central-auth job puts on the Pages projects. Any long random
#                            string. Unset = broker-issued API tokens are rejected, Clerk tokens still work)
# SLACK_CLIENT_ID           (Slack app → Basic Information → App Credentials)
# SLACK_CLIENT_SECRET       (Slack app → Basic Information → App Credentials)
# SLACK_SIGNING_SECRET      (Slack app → Basic Information → App Credentials; verifies inbound webhooks)
# MAILERSEND_IT_INBOUND_SECRET        (MailerSend → Inbound routes → IT@ route signing secret)
# MAILERSEND_SECURITY_INBOUND_SECRET  (MailerSend → Inbound routes → security@ route signing secret)
# MAILERSEND_INBOUND_SECRET_1         (Mail-tab combined route caleb/kristin/news → single /mail/inbound dispatcher)
# MAILERSEND_INBOUND_SECRET_2         (Mail-tab combined route updates/help/alerts → single /mail/inbound dispatcher)
#   The six Mail-tab boxes (caleb, kristin, news, updates, help, alerts) are served by two combined MailerSend
#   routes; point each route's single webhook forward at https://api.getsweepr.com/mail/inbound and set the two
#   secrets above. Legacy per-box secrets (MAILERSEND_<BOX>_INBOUND_SECRET) are still accepted during migration
#   if a route still fans out to /mail/inbound/<box>.
# MAILERSEND_WEBHOOK_SECRET   (MailerSend → Webhooks → signing secret; verifies inbound delivery/open/click events)
# MAILERSEND_SMS_FROM         (toll-free sender number; outbound SMS sends are disabled until this is set)
# MAILERSEND_SMS_INBOUND_SECRET (MailerSend → SMS inbound route signing secret, HMAC-SHA256 of the raw body)
# OPENAI_API_KEY            (OpenAI API key — vision scope review; server-side only)
# OPENAI_VISION_MODEL       (optional — vision model override; defaults to gpt-4.1-mini)
# ANTHROPIC_API_KEY         (Claude API key — admin broadcast/email translation; server-side only)
# CF_ANALYTICS_TOKEN        (Cloudflare API token with Analytics:Read — powers admin Observability tile)
# CF_ZONE_ID                (Cloudflare zone ID for getsweepr.com — same account as CF_ANALYTICS_TOKEN)

[env.production]
vars = { ENVIRONMENT = "production" }


[triggers]
crons = ["*/15 * * * *"]
