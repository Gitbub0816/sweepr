# fly.toml app configuration file generated for sweepr on 2026-07-13T04:09:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sweepr'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTH_PAGE_ORIGIN = 'https://auth.getsweepr.com'
  BROKER_DEPLOYMENT = 'standard'
  PORT = '8080'
  PUBLIC_HOST = 'auth.getsweepr.com'
  PUBLIC_ORIGIN = 'https://auth.getsweepr.com'
  RUST_LOG = 'info'
  SESSION_TTL_SECONDS = '259200'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 150
    soft_limit = 100

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
