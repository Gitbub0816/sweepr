#
# Sweepr central authentication broker (Rust / workers-rs).
#
# TWO deployments of this same crate:
#   sweepr-auth-broker        → broker.getsweepr.com        (standard: customer/cleaner/business)
#   sweepr-auth-broker-admin  → admin-broker.getsweepr.com  (admin; SEPARATE secrets, separate
#                                                            rate-limit KV namespace)
# The standard deployment must never hold admin Clerk secrets, and vice versa.
#
# Secrets (wrangler secret put, per deployment):
#   DATABASE_URL              (Neon connection string)
#   CENTRAL_AUTH_ENABLED      ("true" to activate; anything else fails closed 503)
#   BROKER_DEPLOYMENT         ("standard" | "admin")
#   CLERK_ISSUER              (standard only, e.g. https://clerk.getsweepr.com)
#   CLERK_ADMIN_ISSUER        (admin deployment only)
#   AUTH_PAGE_ORIGIN          (standard: https://auth.getsweepr.com)
#   ADMIN_AUTH_PAGE_ORIGIN    (admin: https://admin-auth.getsweepr.com)
#   IP_HASH_SALT              (random 32+ bytes; correlation hashing only)
#   BROKER_KEY_CUSTOMER / BROKER_KEY_CLEANER / BROKER_KEY_BUSINESS
#                             (standard deployment; per-app BFF service keys)
#   BROKER_KEY_ADMIN          (admin deployment only)

name = "sweepr-auth-broker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-06-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[kv_namespaces]]
binding = "RATE_KV"
id = "PLACEHOLDER_SET_IN_DEPLOY"

[env.admin]
name = "sweepr-auth-broker-admin"

[[env.admin.kv_namespaces]]
binding = "RATE_KV"
id = "PLACEHOLDER_SET_IN_DEPLOY_ADMIN"
